name: Apple compatibility

# Apple's own Safari and the VoiceOver screen reader on a macOS machine. Started by hand (Actions → Apple
# compatibility → Run workflow); it deploys nothing.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safari:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Safari, driven through safaridriver
        run: |
          sudo safaridriver --enable
          node e2e/safari.mjs

  voiceover:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: VoiceOver reading the application in Safari
        run: |
          npx --yes @guidepup/setup@0.29.1 setup --ci
          npm install --no-save @guidepup/guidepup@0.35.0
          npx --yes @guidepup/setup@0.29.1 install
          node e2e/voiceover.mjs
